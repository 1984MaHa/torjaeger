<title>Emils Torjäger-Liga</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Lilita+One&display=swap">
<style>
/* Layout: ein Fußballplatz als Bühne. Oben die Anzeigetafel, in der Mitte die Aufgabe als Taktiktafel, unten die Spieltasten. */
:root{
  --pitch:#1d7337; --pitch2:#218040; --chalk:#ffffff; --ink:#16271c; --muted:#5b6b60;
  --paper:#fbfcf7; --board:#0e1c14; --gold:#ffc83d; --goal:#34c56a; --miss:#e5484d; --sky:#2f6fde;
  --display:"Lilita One","Arial Rounded MT Bold",system-ui,sans-serif;
  --body:"Andika","Comic Sans MS",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--pitch);background-image:repeating-linear-gradient(90deg,var(--pitch) 0 70px,var(--pitch2) 70px 140px);color:var(--ink);font-family:var(--body);font-size:18px;-webkit-tap-highlight-color:transparent}
.wrap{max-width:860px;margin:0 auto;padding-inline:16px;padding-block:14px 40px;display:flex;flex-direction:column;gap:14px}
button{font-family:inherit;cursor:pointer;border:0;touch-action:manipulation}
button:focus-visible{outline:4px solid var(--gold);outline-offset:3px}

/* Anzeigetafel */
.board{background:var(--board);color:var(--chalk);border-radius:18px;padding:14px 18px;display:grid;grid-template-columns:1fr auto;gap:10px 16px;align-items:center;box-shadow:0 6px 0 rgba(0,0,0,.25)}
.board .league{font-family:var(--display);font-size:1.5rem;letter-spacing:.5px}
.board .sub{font-size:.9rem;opacity:.8}
.board .pts{font-family:var(--display);font-size:2.2rem;color:var(--gold);text-align:right;font-variant-numeric:tabular-nums;line-height:1}
.board .pts small{display:block;font-family:var(--body);font-size:.8rem;color:var(--chalk);opacity:.8}
.bar{grid-column:1/-1;height:12px;background:#24392c;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--goal),var(--gold));border-radius:99px;transition:width .6s}
.icons{display:flex;gap:8px;grid-column:1/-1;justify-content:space-between;align-items:center;font-size:.9rem}
.pill{background:#24392c;padding:4px 10px;border-radius:99px}
.snd{background:#24392c;color:var(--chalk);padding:6px 12px;border-radius:99px;font-size:.85rem}

/* Kabine / Start */
.title{font-family:var(--display);color:var(--chalk);font-size:clamp(2rem,6vw,3.2rem);line-height:1;text-shadow:0 3px 0 rgba(0,0,0,.25);text-wrap:balance;margin:6px 0 0}
.lead{color:var(--chalk);margin:0;opacity:.95}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.mode{background:var(--paper);border-radius:18px;padding:18px;text-align:left;display:flex;gap:14px;align-items:center;box-shadow:0 6px 0 rgba(0,0,0,.2);transition:transform .1s}
.mode:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.2)}
.mode b{font-family:var(--display);font-size:1.5rem;display:block;font-weight:400}
.mode span{color:var(--muted);font-size:.95rem}
.mode .ic{flex:0 0 56px;height:56px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:1.6rem;color:#fff}
.panel{background:var(--paper);border-radius:18px;padding:16px 18px;box-shadow:0 6px 0 rgba(0,0,0,.2)}
.panel h3{font-family:var(--display);font-weight:400;font-size:1.35rem;margin:0 0 10px}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.st{aspect-ratio:3/4;border-radius:12px;border:3px dashed #c9d3cb;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px;text-align:center;font-size:.78rem;color:var(--muted);max-width:100%}
.st.on{border:3px solid var(--gold);color:var(--ink);background:linear-gradient(160deg,#fff7d6,#ffe79a)}
.st .n{font-family:var(--display);font-size:1.3rem}
details summary{cursor:pointer;font-family:var(--display);font-size:1.25rem;list-style:none}
details summary::-webkit-details-marker{display:none}
.stat{display:grid;grid-template-columns:minmax(0,1fr) 120px 60px;gap:8px;align-items:center;font-size:.95rem;padding:4px 0;border-bottom:1px solid #e6ece7}
.stat .b{height:10px;background:#e6ece7;border-radius:99px;overflow:hidden}.stat .b i{display:block;height:100%}
.stat .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.small{font-size:.9rem;color:var(--muted)}
.btn{background:var(--gold);color:var(--ink);font-family:var(--display);font-size:1.3rem;padding:14px 22px;border-radius:14px;box-shadow:0 5px 0 #c9951d}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #c9951d}
.btn.ghost{background:var(--paper);box-shadow:0 5px 0 #b8c4bb}
.btn.warn{background:var(--miss);color:#fff;box-shadow:0 5px 0 #a3282c;font-size:1rem;padding:10px 14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* Spiel */
.hud{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--chalk);flex-wrap:wrap}
.score{background:var(--board);border-radius:12px;padding:6px 14px;font-family:var(--display);font-size:1.4rem;display:flex;gap:12px;align-items:center;font-variant-numeric:tabular-nums}
.score em{font-style:normal;color:var(--gold)}
.dots{display:flex;gap:6px}
.dots i{width:16px;height:16px;border-radius:50%;background:rgba(255,255,255,.3)}
.dots i.ok{background:var(--goal);box-shadow:0 0 0 2px #fff}.dots i.no{background:var(--miss);box-shadow:0 0 0 2px #fff}.dots i.now{background:#fff}
.card{background:var(--paper);border-radius:20px;padding:20px;box-shadow:0 8px 0 rgba(0,0,0,.22);display:flex;flex-direction:column;gap:16px;min-height:300px}
.tag{font-size:.8rem;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted)}
.q{font-size:clamp(1.45rem,3.6vw,2rem);line-height:1.35;margin:0}
.q mark{background:#ffe38a;padding:0 6px;border-radius:6px;color:var(--ink)}
.vis{display:flex;justify-content:center;overflow-x:auto}
.ans{min-height:70px;border:4px solid var(--ink);border-radius:14px;font-size:2.4rem;font-family:var(--display);display:flex;align-items:center;justify-content:center;min-width:150px;align-self:center;padding:0 20px;background:#fff;font-variant-numeric:tabular-nums}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:520px;width:100%;align-self:center}
.pad button{background:#e9f2eb;font-family:var(--display);font-size:1.9rem;padding:14px 0;border-radius:14px;box-shadow:0 4px 0 #b9cabd;color:var(--ink)}
.pad button:active{transform:translateY(3px);box-shadow:0 1px 0 #b9cabd}
.pad .ok{background:var(--goal);color:#fff;box-shadow:0 4px 0 #1f8a45}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.choices button{background:#e9f2eb;border-radius:14px;padding:18px 10px;font-size:1.6rem;font-family:var(--body);font-weight:700;box-shadow:0 4px 0 #b9cabd;color:var(--ink)}
.choices button.right{background:var(--goal);color:#fff}.choices button.wrong{background:var(--miss);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.chips button{background:#fff;border:3px solid #cfd9d1;border-radius:12px;padding:10px 14px;font-size:1.5rem;font-family:var(--body);color:var(--ink)}
.chips button.pick::after{content:".";color:var(--miss);font-weight:700}
.chips button.pick{border-color:var(--sky)}
.chips button.right{border-color:var(--goal);background:#e3f7ea}.chips button.wrong{border-color:var(--miss);background:#fde8e8}
.hintbtn{align-self:flex-start;background:none;color:var(--sky);font-size:1rem;text-decoration:underline;padding:0}
.hint{background:#eaf1fd;border-radius:12px;padding:10px 14px;font-size:1rem;line-height:1.5}
.fb{border-radius:16px;padding:14px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.fb.ok{background:#e3f7ea}.fb.no{background:#fde8e8}
.fb .big{font-family:var(--display);font-size:1.8rem}
.fb.ok .big{color:#1f8a45}.fb.no .big{color:#b3262b}
.fb p{margin:0;font-size:1.15rem;flex:1 1 260px;min-width:0}
.plus{font-family:var(--display);color:#1f8a45;font-size:1.3rem}

/* Torschuss */
.goalwrap{width:120px;height:74px;position:relative;flex:0 0 auto}
.goalwrap .ballx{position:absolute;left:4px;bottom:0;width:26px;height:26px}
.goalwrap.shoot .ballx{animation:shoot .7s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes shoot{0%{transform:translate(0,0) rotate(0)}60%{transform:translate(70px,-34px) rotate(300deg)}100%{transform:translate(78px,-26px) rotate(360deg)}}
.goalwrap.miss .ballx{animation:miss .7s ease-out forwards}
@keyframes miss{to{transform:translate(90px,-70px) rotate(200deg);opacity:.2}}
@media (prefers-reduced-motion:reduce){.goalwrap .ballx{animation:none!important}.bar i{transition:none}}

/* Ergebnis */
.result{text-align:center;align-items:center}
.result .final{font-family:var(--display);font-size:clamp(2.4rem,9vw,4rem);line-height:1;display:flex;gap:16px;align-items:center;justify-content:center;flex-wrap:wrap}
.result .final .team{font-size:clamp(1.2rem,3.5vw,1.6rem)}
.result .final small{font-size:1rem;font-family:var(--body);display:block;color:var(--muted)}
.result h2{font-family:var(--display);font-weight:400;font-size:2rem;margin:0}
.newst{width:130px;margin:0 auto}
.confirm{background:#fde8e8;border-radius:12px;padding:10px 12px}
</style>
<style>
/* Ligen */
.leagues{display:grid;gap:12px}
.lg{background:var(--paper);border-radius:18px;padding:16px 18px;box-shadow:0 6px 0 rgba(0,0,0,.2);display:flex;flex-direction:column;gap:12px}
.lg.locked{background:#dfe8e1}
.lg-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.lg-head b{font-family:var(--display);font-weight:400;font-size:1.5rem;display:block;line-height:1.1}
.lg-head span.k{color:var(--muted);font-size:.95rem}
.badge{font-size:.85rem;padding:5px 12px;border-radius:99px;font-weight:700;white-space:nowrap}
.badge.cur{background:var(--gold);color:var(--ink)}
.badge.done{background:var(--goal);color:#fff}
.badge.probe{background:var(--sky);color:#fff}
.badge.wait{background:#f3d7a4;color:var(--ink)}
.badge.lock{background:#b9c7bd;color:var(--ink)}
.chipsT{display:flex;flex-wrap:wrap;gap:6px}
.chipsT span{font-size:.82rem;padding:4px 10px;border-radius:99px;background:#e6ece7;color:var(--muted)}
.chipsT span.ok{background:#d4f2de;color:#1f6b3a;font-weight:700}
.modes.sm{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.modes.sm .mode{padding:12px 14px;box-shadow:0 4px 0 rgba(0,0,0,.18);background:#fff;border:2px solid #dfe8e1}
.modes.sm .mode b{font-size:1.2rem}
.modes.sm .mode .ic{flex-basis:42px;height:42px;font-size:1.2rem}
.note{font-size:.95rem;color:var(--muted);margin:0}
.btn.sm{font-size:1.05rem;padding:10px 16px}
.pairrow{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;font-family:var(--display);font-size:1.8rem}
.pairrow .ans{min-width:110px;cursor:pointer}
.pairrow .ans.act{border-color:var(--sky);box-shadow:0 0 0 4px #cfe0ff}
.pin{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pin input{font-size:1.3rem;width:130px;padding:8px 10px;border:2px solid #b9c7bd;border-radius:10px;font-family:var(--body);letter-spacing:4px}
.parent{border-top:1px solid #e6ece7;margin-top:10px;padding-top:10px;display:grid;gap:10px}
.parent .prow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.celebrate{background:#fff4c9;border:3px solid var(--gold);border-radius:14px;padding:12px 14px;font-size:1.15rem}
h4.gl{margin:12px 0 4px;font-size:1rem}
</style>
<div class="wrap" id="app"></div>

<script>
(function(){
"use strict";
// ================= Ligen und Themen =================
const LIGEN=[
  {id:"L1",name:"Bambini-Liga",klasse:"Klasse 2",math:["m_read","m_split","m_plaet","m_zehner","m_mal","m_rechnen"],deu:["d_wortart","d_verl","d_satz"]},
  {id:"L2",name:"Kreisliga",klasse:"Klasse 3",math:["m3_rest","m3_1x1","m3_htz","m3_plus","m3_sach"],deu:["d3_praet","d3_fam","d3_ie","d3_doppel","d3_satzglied"]},
  {id:"L3",name:"Bezirksliga",klasse:"Klasse 4",math:["m4_stelle","m4_mult","m4_div","m4_runden"],deu:["d4_perfekt","d4_rede","d4_steigern"]}
];
const TOPICS={
  m_read:"Zahlen lesen",m_split:"Zehner und Einer",m_plaet:"Plättchen zaubern",m_zehner:"Zehner oder Einer dazu",m_mal:"Malaufgaben zum Bild",m_rechnen:"Kopfrechnen bis 100",
  d_wortart:"Wortarten",d_verl:"Verlängern",d_satz:"Satzende finden",
  m3_rest:"Teilen mit Rest",m3_1x1:"Einmaleins",m3_htz:"Hunderter, Zehner, Einer",m3_plus:"Rechnen bis 1000",m3_sach:"Sachaufgaben mit Rest",
  d3_praet:"Vergangenheit (Präteritum)",d3_fam:"Wortfamilien",d3_ie:"i oder ie",d3_doppel:"Doppelte Mitlaute",d3_satzglied:"Subjekt und Prädikat",
  m4_stelle:"Zahlen bis 1 Million",m4_mult:"Malnehmen groß",m4_div:"Teilen groß",m4_runden:"Runden",
  d4_perfekt:"Perfekt",d4_rede:"Wörtliche Rede",d4_steigern:"Adjektive steigern"};
const WEAK={m_split:1.3,m_plaet:1.4,m_zehner:1.5,m_mal:1.1,m_rechnen:.9,d_wortart:1.5,d_verl:1.3,d_satz:1.4};
const STICKERS=["Anstoß","Doppelpass","Flanke","Kopfball","Dribbling","Eckball","Freistoß","Elfmeter","Torwart-Parade","Fallrückzieher","Hattrick","Kapitän","Goldener Schuh","Pokal","Meisterschale","Champions-Stern","Flutlicht","Fankurve","Aufstieg","Derbysieg","Rekordtor","Traumpass","Wembley-Tor","Weltmeister"];
const RIVALS=["FC Zahlenfuchs","SV Silbenbogen","Rot-Weiß Einmaleins","Kickers Komma","Eintracht Einer","Zehner United","Dynamo Diktat","Borussia Bündel","Hertha Hunderter","Viktoria Verb"];
const ROUND=8,TRIAL=3,PROBE=20,MASTER_N=10,MASTER_K=8;
const topicsOf=i=>LIGEN[i].math.concat(LIGEN[i].deu);

const fresh=()=>({points:0,rounds:0,wins:0,stickers:0,stats:{},days:[],history:[],sound:true,pin:"",lg:{L2:{budget:null,open:false,trial:""},L3:{budget:null,open:false,trial:""}},sel:0});
let S=fresh(),db=null,view="home",G=null,UI={confirmReset:false,parent:false,pinMsg:"",celebrate:""};

// ================= Speicher =================
function merge(o){const f=fresh();const s=Object.assign(f,o||{});s.lg=Object.assign(fresh().lg,s.lg||{});
  Object.keys(s.lg).forEach(k=>{s.lg[k]=Object.assign({budget:null,open:false,trial:""},s.lg[k]);});
  Object.keys(s.stats).forEach(k=>{if(!Array.isArray(s.stats[k].last))s.stats[k].last=[];});return s;}
function localLoad(){try{const t=localStorage.getItem("torjaeger");if(t)S=merge(JSON.parse(t));}catch(e){}}
function localSave(){try{localStorage.setItem("torjaeger",JSON.stringify(S));}catch(e){}}
async function save(rec){localSave();if(!db)return;
  try{await db.doc("players/emil").set(JSON.parse(JSON.stringify(S)));}catch(e){}
  if(rec){try{await db.collection("rounds").doc().set(rec);}catch(e){}}}
async function connect(){
  try{if(!window.claude||!window.claude.use)return;db=await window.claude.use("db");if(!db)return;
    const snap=await db.doc("players/emil").get();
    if(snap.exists){S=merge(JSON.parse(JSON.stringify(snap.data())));localSave();}else if(S.rounds>0)save();
    if(view==="home")render();}catch(e){}
}

// ================= Hilfen =================
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const fmt=n=>String(n).replace(/\B(?=(\d{3})+(?!\d))/g," ");
const dkey=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const today=()=>dkey(new Date());
function streakDays(){const set=new Set(S.days);let n=0;const d=new Date();if(!set.has(today()))d.setDate(d.getDate()-1);
  while(set.has(dkey(d))){n++;d.setDate(d.getDate()-1);}return n;}
function hash(p){let h=5381;const s="torjaeger:"+p;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))>>>0;return "h"+h.toString(36);}

// ================= Ligen-Logik =================
function topicSafe(t){const s=S.stats[t];if(!s||!s.last)return false;const l=s.last.slice(-MASTER_N);return l.length>=MASTER_N&&l.reduce((a,b)=>a+b,0)>=MASTER_K;}
function safeCount(i){return topicsOf(i).filter(topicSafe).length;}
function mastered(i){return safeCount(i)===topicsOf(i).length;}
function state(i){ // open | probe | wait | locked
  if(i===0)return"open";const l=S.lg[LIGEN[i].id];
  if(l.open)return"open";if(l.budget!==null)return l.budget>0?"probe":"wait";return"locked";}
function playable(i){const s=state(i);return s==="open"||s==="probe";}
function topLeague(){let t=0;LIGEN.forEach((_,i)=>{if(state(i)!=="locked")t=i;});return t;}
function canTrial(i){return state(i)==="locked"&&i<=topLeague()+2&&S.lg[LIGEN[i].id].trial!==today();}
function checkPromotions(){let msg="";
  for(let i=0;i<LIGEN.length-1;i++){const nx=S.lg[LIGEN[i+1].id];
    if(mastered(i)&&nx.budget===null&&!nx.open){nx.budget=PROBE;msg=`Stark! Die ${LIGEN[i].name} ist durchgespielt. In der ${LIGEN[i+1].name} kannst du jetzt ${PROBE} Aufgaben spielen.`;}}
  return msg;}

// ================= Klang =================
let AC=null;
function tone(fs,dur){if(!S.sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  fs.forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type="triangle";o.frequency.value=f;const t=AC.currentTime+i*dur;
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.25,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+dur+.02);});}catch(e){}}

// ================= Grafiken =================
function ballSVG(s,cls){return `<svg ${cls===false?"":'class="ballx"'} width="${s}" height="${s}" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="#fff" stroke="#16271c" stroke-width="2.5"/><polygon points="20,12 27,17 24.5,25 15.5,25 13,17" fill="#16271c"/><path d="M20 12V3M27 17l9-3M24.5 25l5.5 8M15.5 25L10 33M13 17l-9-3" stroke="#16271c" stroke-width="2.5" fill="none"/></svg>`;}
function goalSVG(){let s=`<div class="goalwrap" id="gw"><svg width="120" height="74" viewBox="0 0 120 74" aria-hidden="true"><rect x="62" y="6" width="54" height="64" fill="none" stroke="#16271c" stroke-width="4"/>`;
  for(let i=0;i<6;i++)s+=`<line x1="${62+i*9}" y1="6" x2="${62+i*9}" y2="70" stroke="#16271c" opacity=".35"/>`;for(let i=0;i<7;i++)s+=`<line x1="62" y1="${6+i*9}" x2="116" y2="${6+i*9}" stroke="#16271c" opacity=".35"/>`;
  return s+`<line x1="0" y1="71" x2="120" y2="71" stroke="#16271c" stroke-width="2"/></svg>${ballSVG(26)}</div>`;}
function blocksSVG(z,e){const u=18,gap=7,w=10*u+10,h=Math.max(1,z)*(u+gap)+(e?u+16:0)+6;let s=`<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="${z} Zehnerstangen und ${e} Einerwürfel">`;let y=4;
  for(let i=0;i<z;i++){for(let k=0;k<10;k++)s+=`<rect x="${5+k*u}" y="${y}" width="${u}" height="${u}" fill="#9fc3a9" stroke="#16271c" stroke-width="1.5"/>`;y+=u+gap;}
  y=z?y+6:4;for(let k=0;k<e;k++)s+=`<rect x="${5+k*(u+6)}" y="${y}" width="${u}" height="${u}" fill="#ffd66b" stroke="#16271c" stroke-width="1.5"/>`;return s+"</svg>";}
function stwSVG(z,e){const W=300,H=150,cw=W/2;let s=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Stellenwerttafel"><rect x="2" y="2" width="${W-4}" height="${H-4}" fill="#fff" stroke="#16271c" stroke-width="3"/><rect x="2" y="2" width="${W-4}" height="34" fill="#e3f0e6" stroke="#16271c" stroke-width="3"/><line x1="${cw}" y1="2" x2="${cw}" y2="${H-2}" stroke="#16271c" stroke-width="3"/><text x="${cw/2}" y="27" text-anchor="middle" font-size="22" font-family="Andika,sans-serif" font-weight="700" fill="#16271c">Z</text><text x="${cw*1.5}" y="27" text-anchor="middle" font-size="22" font-family="Andika,sans-serif" font-weight="700" fill="#16271c">E</text>`;

function fieldSVG(r,c){const d=38,w=c*d+20,h=r*d+20;let s=`<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="Punktefeld"><rect x="2" y="2" width="${w-4}" height="${h-4}" rx="10" fill="#fff" stroke="#16271c" stroke-width="3"/>`;

  for(let g=0;g<n;g++){const x=(g%per)*(gw+10),y=Math.floor(g/per)*(gh+10),cnt=g<q?b:r,full=g<q;

  m_plaet(){const z=R(1,8),e=R(1,8),n=10*z+e,dazu=Math.random()<.6,valid=dazu?[n+10,n+1]:[n-10,n-1],right=pick(valid);

  m_mal(){let r=R(2,5),c=R(2,6);if(r===c)c=c===6?5:c+1;const ex=`${r} Reihen mit je ${c} Punkten: ${r} · ${c} = ${r*c}.`;

  m4_div(){const b=R(2,9),q=R(11,40),a=b*q,big=Math.floor(q/10)*10*b;return{type:"num",q:`${a} : ${b} = ?`,a:q,ex:`${big} : ${b} = ${big/b} und ${a-big} : ${b} = ${(a-big)/b}. Zusammen ${q}.`,hint:`Zerlege ${a} in Zahlen, die gut durch ${b} gehen.`};},
  m4_runden(){const n=R(1001,9989),down=Math.floor(n/100)*100,up=down+100,right=n%100>=50?up:down,wrong=right===up?down:up,z=Math.round(n/10)*10;
    const ch=[fmt(right),fmt(wrong)];if(z!==right&&z!==wrong)ch.push(fmt(z));
    return{type:"choice",q:`Runde <b>${fmt(n)}</b> auf <mark>Hunderter</mark>.`,choices:ch,a:fmt(right),ex:`Die Zehnerziffer ist ${Math.floor(n/10)%10}. ${n%100>=50?"Ab 5 wird aufgerundet":"Unter 5 wird abgerundet"}: ${fmt(right)}.`,hint:"Schau auf die Ziffer rechts neben den Hundertern. 0 bis 4: abrunden. 5 bis 9: aufrunden."};},
  d4_perfekt(){const v=pick(PERF);return{type:"choice",q:`Setze <b>${v[0]}</b> ins <mark>Perfekt</mark>.`,choices:[v[1],v[2],v[3]],a:v[1],ex:`Richtig: ${v[1]}.`,hint:"Perfekt: habe oder bin + ge…-Form. Bei Bewegungen von A nach B oft „bin“."};},
  d4_rede(){const r=pick(REDE),t=r[2],pz=r[3];const right=`${r[0]} ${r[1]}: „${t}${pz}“`,w1=`${r[0]} ${r[1]} „${t}${pz}“`,w2=`${r[0]} ${r[1]}: ${t}${pz}`,w3=`${r[0]} ${r[1]}: „${t.charAt(0).toLowerCase()+t.slice(1)}${pz}“`;
    return{type:"choice",q:"Welcher Satz ist mit <mark>wörtlicher Rede</mark> richtig geschrieben?",choices:[right,w1,w2,w3],a:right,small:true,ex:`Nach dem Begleitsatz kommt ein Doppelpunkt. Das Gesagte steht in Anführungszeichen und beginnt groß: ${right}`,hint:"Begleitsatz, Doppelpunkt, „Gesagtes mit großem Anfang und Satzzeichen“."};},
  d4_steigern(){const s=pick(STEIG),sup=Math.random()<.4;
    if(sup)return{type:"choice",q:`${s[0]} → ${s[1]} → <mark>___</mark>`,choices:[s[2],"am "+s[3],"am "+s[1]].filter((x,i,a)=>a.indexOf(x)===i),a:s[2],ex:`${s[0]}, ${s[1]}, ${s[2]}.`};
    return{type:"choice",q:`${s[0]} → <mark>___</mark> → ${s[2]}`,choices:[s[1],s[3],"mehr "+s[0]],a:s[1],ex:`${s[0]}, ${s[1]}, ${s[2]}.`};}
};

// ================= Auswahl =================
function weightOf(t){const s=S.stats[t];let w=WEAK[t]||1.2;if(s&&s.last&&s.last.length>=3){const l=s.last.slice(-MASTER_N);w*=0.5+2.2*(1-l.reduce((a,b)=>a+b,0)/l.length);}if(topicSafe(t))w*=.6;return Math.max(.25,w);}
function nextTopic(pool,last){let tot=0;const ws=pool.map(t=>{const w=weightOf(t)*(t===last?.3:1);tot+=w;return w;});let x=Math.random()*tot;for(let i=0;i<pool.length;i++){x-=ws[i];if(x<=0)return pool[i];}return pool[pool.length-1];}

// ================= Spielablauf =================
function startRound(li,mode,trial){
  const L=LIGEN[li],pool=mode==="math"?L.math:mode==="deu"?L.deu:L.math.concat(L.deu);
  let len=trial?TRIAL:ROUND;const st=state(li);if(!trial&&st==="probe")len=Math.min(ROUND,S.lg[L.id].budget);
  if(trial){S.lg[L.id].trial=today();}
  G={li,mode,trial,pool,len,i:0,res:[],hist:[],pts:0,streak:0,rival:pick(RIVALS),last:null};
  S.sel=li;nextTask();view="play";render();window.scrollTo(0,0);
}
function nextTask(){const t=nextTopic(G.pool,G.last);G.last=t;G.task=Object.assign({topic:t},GEN[t]());G.input="";G.inp=["",""];G.act=0;G.done=false;G.showHint=false;G.pickIdx=-1;G.given=null;
  if(G.task.type==="choice"&&!G.task.fixed)G.task.choices=shuffle(G.task.choices);}
function answer(val){if(G.done)return;const T=G.task;let ok;
  if(T.type==="num")ok=Number(val)===T.a;else if(T.type==="pair")ok=Number(val[0])===T.a[0]&&Number(val[1])===T.a[1];else ok=val===T.a;
  G.done=true;G.ok=ok;G.given=val;G.res.push(ok);
  const st=S.stats[T.topic]||(S.stats[T.topic]={a:0,c:0,last:[]});st.a++;if(ok)st.c++;st.last.push(ok?1:0);st.last=st.last.slice(-MASTER_N);
  const L=LIGEN[G.li];if(!G.trial&&state(G.li)==="probe")S.lg[L.id].budget=Math.max(0,S.lg[L.id].budget-1);
  G.hist.push({topic:T.topic,ok,q:T.q.replace(/<[^>]+>/g,""),given:String(val),right:rightText(T)});
  if(ok){G.streak++;G.gain=10+(G.streak>=3?5:0);G.pts+=G.gain;tone([523,659,784],.12);}else{G.streak=0;G.gain=0;tone([220,180],.18);}
  render();requestAnimationFrame(()=>{const gw=document.getElementById("gw");if(gw)gw.classList.add(ok?"shoot":"miss");});}
function rightText(T){return T.type==="tap"?T.words[T.a]:T.type==="pair"?`${T.a[0]} Rest ${T.a[1]}`:String(T.a);}
function next(){G.i++;if(G.i>=G.len){finish();return;}nextTask();render();}
function finish(){
  const c=G.res.filter(Boolean).length,n=G.len,win=!G.trial&&c/n>=.6,perfect=!G.trial&&c===n&&n>=5;
  G.bonus=(win?20:0)+(perfect?30:0);G.pts+=G.bonus;S.points+=G.pts;S.rounds++;
  G.newSticker=null;if(win){S.wins++;if(S.stickers<STICKERS.length){G.newSticker=S.stickers;S.stickers++;}}
  const d=today();if(!S.days.includes(d)){S.days.push(d);S.days=S.days.slice(-120);}
  UI.celebrate=checkPromotions();
  S.history.push({d,liga:LIGEN[G.li].id,mode:G.mode,trial:!!G.trial,c,n,pts:G.pts});S.history=S.history.slice(-40);
  view="result";render();window.scrollTo(0,0);
  save({date:new Date().toISOString(),liga:LIGEN[G.li].id,mode:G.mode,trial:!!G.trial,correct:c,total:n,points:G.pts,tasks:G.hist});
}

// ================= Darstellung =================
function boardHTML(){const top=topLeague(),L=LIGEN[top],sc=safeCount(top),tot=topicsOf(top).length,pct=Math.round(sc/tot*100);
  return `<header class="board"><div><div class="league">${L.name} · ${L.klasse}</div><div class="sub">${sc} von ${tot} Themen sicher${top<LIGEN.length-1?` · dann geht es in die ${LIGEN[top+1].name}`:""}</div></div>
  <div class="pts">${S.points}<small>Punkte</small></div><div class="bar"><i style="width:${pct}%"></i></div>
  <div class="icons"><span class="pill">${streakDays()} Trainingstage in Folge</span><span class="pill">${S.wins} Siege · ${S.rounds} Spiele</span><button class="snd" id="snd">${S.sound?"Ton an":"Ton aus"}</button></div></header>`;}
function stickerHTML(i,on){return `<div class="st ${on?"on":""}">${on?ballSVG(34,false):""}<span class="n">${i+1}</span><span>${on?STICKERS[i]:"?"}</span></div>`;}
function modeBtns(li,small){return `<div class="modes ${small?"sm":""}">
  <button class="mode" data-play="${li}:math"><span class="ic" style="background:var(--sky)">+</span><span><b>Mathe-Spiel</b></span></button>
  <button class="mode" data-play="${li}:deu"><span class="ic" style="background:var(--miss)">Aa</span><span><b>Deutsch-Spiel</b></span></button>
  <button class="mode" data-play="${li}:mix"><span class="ic" style="background:var(--ink)">★</span><span><b>Mix-Spiel</b></span></button></div>`;}
function leagueCard(i){const L=LIGEN[i],st=state(i),top=topLeague(),ms=mastered(i),l=S.lg[L.id];
  let badge,body="";
  if(st==="open"){badge=ms?`<span class="badge done">Durchgespielt</span>`:i===top?`<span class="badge cur">Deine Liga</span>`:`<span class="badge done">Frei</span>`;}
  else if(st==="probe")badge=`<span class="badge probe">Probetraining: noch ${l.budget} Aufgaben</span>`;
  else if(st==="wait")badge=`<span class="badge wait">Wartet auf Freigabe</span>`;
  else badge=`<span class="badge lock">Gesperrt</span>`;
  const chips=`<div class="chipsT">${topicsOf(i).map(t=>`<span class="${topicSafe(t)?"ok":""}">${topicSafe(t)?"✓ ":""}${TOPICS[t]}</span>`).join("")}</div>`;
  if(playable(i)){body=chips+modeBtns(i,true);if(st==="probe")body+=`<p class="note">Wenn die ${PROBE} Probe-Aufgaben gespielt sind, können Mama oder Papa die Liga ganz freigeben.</p>`;}
  else if(st==="wait"){body=chips+`<p class="note">Das Probetraining ist geschafft. Jetzt müssen Mama oder Papa die ${L.name} in der Trainerbank freigeben.</p>`;}
  else{const prev=LIGEN[i-1];
    body=`<p class="note">Freispielen: In der ${prev.name} alle Themen sicher schaffen (je ${MASTER_K} von den letzten ${MASTER_N} Aufgaben richtig). Stand: ${safeCount(i-1)} von ${topicsOf(i-1).length}.</p>`+
      (canTrial(i)?`<div class="row"><button class="btn sm" data-trial="${i}">Schnuppern: ${TRIAL} Aufgaben</button><span class="note">Einmal am Tag</span></div>`:i<=top+2?`<p class="note">Heute schon geschnuppert. Morgen geht es wieder.</p>`:"");}
  return `<section class="lg ${playable(i)?"":"locked"}"><div class="lg-head"><div><b>${L.name}</b><span class="k">${L.klasse}</span></div>${badge}</div>${body}</section>`;}

function parentHTML(){
  if(!S.pin)return `<div class="parent"><p class="note">Legt eine Eltern-PIN fest (4 Ziffern). Damit gebt ihr Ligen frei oder setzt den Spielstand zurück.</p>
    <div class="pin"><input id="pinNew" type="password" inputmode="numeric" maxlength="4" autocomplete="off" aria-label="Neue PIN"><button class="btn sm" id="pinSet">PIN speichern</button></div>${UI.pinMsg?`<p class="note">${UI.pinMsg}</p>`:""}</div>`;

  let rows=LIGEN.slice(1).map((L,k)=>{const i=k+1,st=state(i),l=S.lg[L.id];

  return `<div class="parent">${rows}<div class="row">${UI.confirmReset?`<span>Wirklich alles löschen?</span><button class="btn warn" id="resetYes">Ja, löschen</button><button class="btn ghost sm" id="resetNo">Abbrechen</button>`:`<button class="btn warn" id="reset">Spielstand zurücksetzen</button>`}<button class="btn ghost sm" id="pinClose">Eltern-Bereich schließen</button></div></div>`;}

function homeHTML(){
  const stats=LIGEN.map((L,i)=>`<h4 class="gl">${L.name} (${L.klasse})</h4>`+topicsOf(i).map(t=>{const s=S.stats[t],l=s&&s.last?s.last.slice(-MASTER_N):[],k=l.reduce((a,b)=>a+b,0),p=l.length?Math.round(k/l.length*100):0,

    return `<div class="stat"><span>${TOPICS[t]}</span><span class="b"><i style="width:${l.length?p:0}%;background:${col}"></i></span><span class="v">${l.length?`${k}/${l.length}`:"–"}</span></div>`;}).join("")).join("");
  return boardHTML()+`
  <div><h1 class="title">Emils Torjäger-Liga</h1><p class="lead">Jedes Spiel hat ${ROUND} Aufgaben. Richtig heißt Tor! Spiel eine Liga durch, dann darfst du in die nächste aufsteigen. In die leichteren Ligen kannst du immer zurück.</p></div>

  <p class="small">Für jedes gewonnene Spiel gibt es einen Sticker. Gewonnen hast du ab 5 von 8 Toren.</p></section>
  <section class="panel"><details ${UI.parent||UI.pinMsg?"open":""}><summary>Trainerbank (für Mama und Papa)</summary>
    <p class="small">Zahlen zeigen, wie viele der letzten ${MASTER_N} Aufgaben je Thema richtig waren. Ein Thema ist sicher ab ${MASTER_K} von ${MASTER_N}. Schwache Themen kommen öfter dran.</p>${stats}
    <p class="small">${db?"Der Spielstand wird online gespeichert. Schließen und neu öffnen verliert nichts.":"Der Spielstand wird in diesem Browser gespeichert."}</p>${parentHTML()}
  </details></section>`;}

function inputHTML(T){
  if(T.type==="num"){let h=`<div class="ans" aria-live="polite">${G.done?G.given:(G.input||"&nbsp;")}</div>`;if(!G.done)h+=padHTML();return h;}
  if(T.type==="pair"){const v=G.done?G.given:G.inp;let h=`<div class="pairrow"><span class="ans ${!G.done&&G.act===0?"act":""}" data-slot="0" role="button" aria-label="${T.labels[0]}">${v[0]||"&nbsp;"}</span><span>Rest</span><span class="ans ${!G.done&&G.act===1?"act":""}" data-slot="1" role="button" aria-label="${T.labels[1]}">${v[1]||"&nbsp;"}</span></div>`;
    if(!G.done)h+=padHTML();return h;}
  if(T.type==="choice")return `<div class="choices">${T.choices.map(ch=>{let cl="";if(G.done){if(ch===T.a)cl="right";else if(ch===G.given)cl="wrong";}return `<button class="${cl}" data-c="${ch.replace(/"/g,"&quot;")}" ${G.done?"disabled":""} ${T.small?'style="font-size:1.15rem;font-weight:400"':""}>${ch}</button>`;}).join("")}</div>`;
  let h=`<div class="chips">${T.words.map((w,i)=>{let cl="";if(G.done){if(i===T.a)cl="right"+(T.mark?" pick":"");else if(i===G.given)cl="wrong";}else if(i===G.pickIdx)cl=T.mark?"pick":"pick";return `<button class="${cl}" data-w="${i}" ${G.done?"disabled":""}>${w}</button>`;}).join("")}</div>`;
  if(!G.done)h+=`<button class="btn" id="tapok" ${G.pickIdx<0?'disabled style="opacity:.5"':""}>${T.tapLabel}</button>`;return h;}
function padHTML(){return `<div class="pad">${[1,2,3,"del",4,5,6,0,7,8,9,"ok"].map(k=>k==="del"?`<button data-k="del" aria-label="Löschen">⌫</button>`:k==="ok"?`<button class="ok" data-k="ok">Schuss!</button>`:`<button data-k="${k}">${k}</button>`).join("")}</div>`;}

function playHTML(){const T=G.task,c=G.res.filter(Boolean).length,m=G.res.length-c,L=LIGEN[G.li];
  const dots=Array.from({length:G.len},(_,i)=>`<i class="${i<G.res.length?(G.res[i]?"ok":"no"):i===G.i?"now":""}"></i>`).join("");
  let fb="";if(G.done){fb=G.ok?`<div class="fb ok">${goalSVG()}<span class="big">Tor!</span><span class="plus">+${G.gain}${G.gain>10?" Serie!":""}</span><p>${T.ex}</p></div>`
      :`<div class="fb no">${goalSVG()}<span class="big">Knapp vorbei</span><p><b>Richtig ist: ${rightText(T)}.</b> ${T.ex}</p></div>`;
    fb+=`<button class="btn" id="next">${G.i+1>=G.len?"Abpfiff":"Weiter"}</button>`;}
  const hint=T.hint&&!G.done?(G.showHint?`<div class="hint">${T.hint}</div>`:`<button class="hintbtn" id="hint">Trainer-Tipp anzeigen</button>`):"";
  return `<div class="hud"><button class="btn ghost" id="home" style="font-size:1rem;padding:8px 14px">Kabine</button>
    <div class="score">Emil <em>${c}</em> : <em>${m}</em> ${G.rival}</div><div class="dots">${dots}</div></div>
    <section class="card"><div class="tag">${L.name}${G.trial?" · Schnuppern":""} · Aufgabe ${G.i+1} von ${G.len} · ${TOPICS[T.topic]}</div>
    <p class="q">${T.q}</p>${T.vis?`<div class="vis">${T.vis}</div>`:""}${inputHTML(T)}${hint}${fb}</section>
    <p class="lead small" style="color:#fff">Lies zuerst das gelb markierte Wort. Dann erst schießen!</p>`;}

function resultHTML(){const c=G.res.filter(Boolean).length,n=G.len,m=n-c,L=LIGEN[G.li];
  const head=G.trial?"Schnuppertraining vorbei":c===n?"Perfektes Spiel!":c/n>=.6?"Sieg!":c/n>=.5?"Unentschieden":"Heute verloren. Nächstes Mal klappt es!";
  const st=state(G.li);let info="";

    ${G.newSticker!==null?`<p>Neuer Sticker für dein Album:</p><div class="newst">${stickerHTML(G.newSticker,true)}</div>`:G.trial?"":(c/n>=.6?"<p>Dein Album ist voll. Stark!</p>":"<p>Gewinne ein Spiel, dann bekommst du einen Sticker.</p>")}
    <div class="row" style="justify-content:center">${!G.trial&&playable(G.li)?`<button class="btn" id="again">Nächstes Spiel</button>`:""}<button class="btn ghost" id="home">Zur Kabine</button></div></section>`;}

function render(){document.getElementById("app").innerHTML=view==="home"?homeHTML():view==="play"?playHTML():resultHTML();bind();}
function typeDigit(k){const T=G.task;if(T.type==="pair"){const v=G.inp[G.act];if(v.length<3)G.inp[G.act]=(v==="0"?"":v)+k;}else if(G.input.length<6)G.input=(G.input==="0"?"":G.input)+k;render();}
function del(){if(G.task.type==="pair")G.inp[G.act]=G.inp[G.act].slice(0,-1);else G.input=G.input.slice(0,-1);render();}
function ok(){const T=G.task;if(T.type==="pair"){if(G.act===0&&G.inp[0]!==""&&G.inp[1]===""){G.act=1;render();return;}if(G.inp[0]!==""&&G.inp[1]!=="")answer(G.inp.slice());return;}if(G.input!=="")answer(G.input);}
function bind(){const $=id=>document.getElementById(id);
  document.querySelectorAll("[data-play]").forEach(b=>b.onclick=()=>{const [li,m]=b.dataset.play.split(":");startRound(Number(li),m,false);});
  document.querySelectorAll("[data-trial]").forEach(b=>b.onclick=()=>startRound(Number(b.dataset.trial),"mix",true));
  if($("snd"))$("snd").onclick=()=>{S.sound=!S.sound;save();render();};
  if($("home"))$("home").onclick=()=>{view="home";UI.confirmReset=false;UI.celebrate="";render();window.scrollTo(0,0);};
  if($("again"))$("again").onclick=()=>{UI.celebrate="";startRound(G.li,G.mode,false);};
  if($("hint"))$("hint").onclick=()=>{G.showHint=true;render();};
  if($("next"))$("next").onclick=next;
  if($("tapok"))$("tapok").onclick=()=>{if(G.pickIdx>=0)answer(G.pickIdx);};
  document.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{const k=b.dataset.k;if(k==="del")del();else if(k==="ok")ok();else typeDigit(k);});
  document.querySelectorAll("[data-slot]").forEach(b=>b.onclick=()=>{if(!G.done){G.act=Number(b.dataset.slot);render();}});
  document.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>answer(b.dataset.c));
  document.querySelectorAll("[data-w]").forEach(b=>b.onclick=()=>{G.pickIdx=Number(b.dataset.w);render();});
  // Eltern
  if($("pinSet"))$("pinSet").onclick=()=>{const v=$("pinNew").value.trim();if(!/^\d{4}$/.test(v)){UI.pinMsg="Bitte genau 4 Ziffern eingeben.";render();return;}S.pin=hash(v);UI.parent=true;UI.pinMsg="";save();render();};
  if($("pinOk"))$("pinOk").onclick=()=>{const v=$("pinIn").value.trim();if(hash(v)===S.pin){UI.parent=true;UI.pinMsg="";}else UI.pinMsg="Die PIN stimmt nicht.";render();};
  if($("pinClose"))$("pinClose").onclick=()=>{UI.parent=false;UI.confirmReset=false;render();};
  document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{const L=LIGEN[Number(b.dataset.open)];S.lg[L.id].open=true;save();render();});
  document.querySelectorAll("[data-lock]").forEach(b=>b.onclick=()=>{const L=LIGEN[Number(b.dataset.lock)];S.lg[L.id].open=false;S.lg[L.id].budget=null;save();render();});
  if($("reset"))$("reset").onclick=()=>{UI.confirmReset=true;render();};
  if($("resetNo"))$("resetNo").onclick=()=>{UI.confirmReset=false;render();};
  if($("resetYes"))$("resetYes").onclick=()=>{const keep={sound:S.sound,pin:S.pin};S=Object.assign(fresh(),keep);UI.confirmReset=false;save();render();};
}
document.addEventListener("keydown",e=>{if(view!=="play"||!G)return;if(e.target&&e.target.tagName==="INPUT")return;
